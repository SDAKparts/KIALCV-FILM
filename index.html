<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試結束</title>
    <style>
        /* 實現全黑背景 */
        body {
            background-color: #000000;
            color: #ffffff; /* 白色文字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        /* 連結樣式：亮藍色以便在黑底中識別，並加上懸停動畫 */
        a {
            color: #38bdf8; 
            font-size: 18px;
            text-decoration: none;
            word-break: break-all;
            transition: color 0.2s ease;
        }
        a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>測試結束，請至正式網址使用：</h1>
        <p>
            <a href="https://kia-film.github.io/PV/">https://kia-film.github.io/PV/</a>
        </p>
    </div>

</body>
</html>
